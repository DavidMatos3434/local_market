name: local_market
description: "Marketplace OS para artesãos dos Açores."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2 # Versão corrigida para compatibilidade com o seu SDK
  
  # Gestão de Estado
  flutter_riverpod: ^2.5.1
  
  # Navegação
  go_router: ^14.0.0
  
  # Networking
  dio: ^5.4.0
  http: ^1.2.0
  
  # UI & Design
  google_fonts: ^6.3.0
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  
  # Geradores de Código
  build_runner: ^2.4.8
  json_serializable: ^6.8.0
  json_annotation: ^4.9.0

flutter:
  generate: true
  uses-material-design: true
